<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Varad Patil" />
    <meta
      name="description"
      content="Varad Patil — Full-stack developer & AI enthusiast crafting fast, scalable, immersive web experiences. M.Tech AI for Sustainability, IIT Kanpur."
    />

    <!-- Open Graph defaults (per-route hook overrides on hydration) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Varad Patil" />
    <meta property="og:title" content="Varad Patil — Developer · Designer · AI Builder" />
    <meta property="og:description" content="Full-stack developer & AI enthusiast. Building fast, scalable, immersive web experiences." />
    <meta property="og:url" content="https://varaddev.vercel.app/" />
    <meta property="og:image" content="https://varaddev.vercel.app/og-image.jpg" />
    <!-- No og:image:width/height here on purpose: the prerenderer swaps
         og:image per case study for that project's screenshot, and it parses
         projects.js as text so it cannot know each image's real dimensions.
         Wrong size hints render worse than none. -->
    <meta property="og:image:alt" content="Varad Patil — Developer, Designer, AI Builder" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Varad Patil — Developer · Designer · AI Builder" />
    <meta name="twitter:description" content="Full-stack developer & AI enthusiast. Building fast, scalable, immersive web experiences." />
    <meta name="twitter:image" content="https://varaddev.vercel.app/og-image.jpg" />

    <link rel="canonical" href="https://varaddev.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen bookmarks ignore favicon.svg and fall back to a
         screenshot; apple-touch-icon must be a PNG. Same pink "V" on ink as
         favicon.svg (generated in the redesign), opaque so it reads on any
         springboard. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted fonts (see scripts/fetch-fonts.mjs). Preload the two
         above-the-fold faces; the rest load via @font-face in fonts.css. -->
    <link
      rel="preload"
      href="/fonts/anybody-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="dns-prefetch" href="https://api.emailjs.com" />

    <title>Varad Patil — Developer · Designer · AI Builder</title>

    <!-- Site-wide schema: who this is, and the site's name (Google uses the
         WebSite node for the name shown above search results). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://varaddev.vercel.app/#person",
            "name": "Varad Patil",
            "url": "https://varaddev.vercel.app",
            "image": "https://varaddev.vercel.app/og-image.jpg",
            "email": "mailto:varadapatil123@gmail.com",
            "jobTitle": "Full-stack Developer & AI Builder",
            "description": "Full-stack developer and AI builder doing an M.Tech in AI for Sustainability at IIT Kanpur.",
            "alumniOf": [
              { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Kanpur" },
              { "@type": "CollegeOrUniversity", "name": "Rajarambapu Institute of Technology" }
            ],
            "knowsAbout": [
              "Full-stack development",
              "Artificial Intelligence",
              "React",
              "Next.js",
              "Flutter",
              "GSAP",
              "Mobile development",
              "UI/UX design"
            ],
            "sameAs": [
              "https://github.com/devVaradPatil",
              "https://www.linkedin.com/in/varad-patil-web-dev/",
              "https://varadiitk.vercel.app",
              "https://codepen.io/varadPatil"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://varaddev.vercel.app/#website",
            "url": "https://varaddev.vercel.app",
            "name": "Varad Patil",
            "publisher": { "@id": "https://varaddev.vercel.app/#person" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
